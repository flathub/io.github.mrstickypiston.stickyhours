app-id: io.github.mrstickypiston.stickyhours
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: stickyhours
cleanup:
  - /include
  - /share/man
finish-args:
  - --share=ipc
  - --share=network
  - --device=dri
  - --socket=wayland
  - --socket=fallback-x11
modules:
  - python3-requirements.json

  - name: stickyhours
    # Bootstrap automatically builds because no other build type is selected
    no-autogen: true
    post-install:
      # App resources
      - install -Dm644 io.github.mrstickypiston.stickyhours.desktop -t /app/share/applications/
      - mkdir -p /app/share/icons/hicolor
      - cp --archive hicolor /app/share/icons
      - install -Dm644 io.github.mrstickypiston.stickyhours.metainfo.xml -t /app/share/metainfo/

      # The app itself
      - mkdir -p /app/briefcase
      - cp --archive app/ /app/briefcase/app
    sources:
      - type: archive
        url: https://github.com/MrStickyPiston/StickyHours/releases/download/1.1.2/StickyHours-Flatpak-src.zip
        sha256: e77ab0209cd8c5dfdc6abecc63e94615cdaa9c7d411f9157c3b72f64e05ce1d9
      - type: patch
        path: fix-python-version.patch
